<div class="admin-container">

    </div>
    
    <div id="alert-container"></div>
    
    <!-- Tab Navigation -->

        <button class="tab active" onclick="switchTab('simple')">Simple Editor</button>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
// Hardcoded API configuration
const API_URL = 'https://observatorycharts-ji28h.bunny.run/api/charts';

let chartInstance = null;

// Initialize preview chart
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('chart-preview');
    chartInstance = echarts.init(container);
    
    // Load chart types which will automatically load first template
    loadChartTypes();
    
    // Load template when chart type changes
    document.getElementById('chart-type').addEventListener('change', async function(e) {
        const chartType = e.target.value;
        await loadTemplate(chartType);
        if (chartType) {
            showAlert(`Loaded ${chartType} template`, 'success');
        }
    });
});

function validateJSON() {
    const configText = document.getElementById('chart-config').value;
    try {
        JSON.parse(configText);
        showAlert('JSON is valid!', 'success');
        return true;
    } catch (e) {
        showAlert(`Invalid JSON: ${e.message}`, 'error');
        return false;
    }
}

function previewChart() {
    if (!validateJSON()) return;
    
    const configText = document.getElementById('chart-config').value;
    const config = JSON.parse(configText);
    
    try {
        generateFormFields(config); // Update form from JSON
        chartInstance.setOption(config, true);
        showAlert('Preview updated!', 'success');
    } catch (e) {
        showAlert(`Error rendering chart: ${e.message}`, 'error');
    }
}

async function saveChart() {
    if (!validateJSON()) return;
    
    const chartId = document.getElementById('chart-id').value;
    const chartType = document.getElementById('chart-type').value;
    const title = document.getElementById('chart-title').value;
    const description = document.getElementById('chart-description').value;
    const configText = document.getElementById('chart-config').value;
    
    const payload = {
        type: chartType,
        metadata: {
            title: title,
            description: description
        },
        config: JSON.parse(configText)
    };
    
    try {
        let response;
        if (chartId) {
            // Update existing chart
            response = await fetch(`${API_URL}/${chartId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
        } else {
            // Create new chart
            response = await fetch(`${API_URL}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
        }
        
        const result = await response.json();
        
        if (response.ok) {
            document.getElementById('chart-id').value = result.chartId;
            showAlert(`Chart saved successfully! ID: ${result.chartId}`, 'success');
        } else {
            showAlert(`Error: ${result.error || 'Failed to save chart'}`, 'error');
        }
    } catch (e) {
        showAlert(`Network error: ${e.message}`, 'error');
    }
}

async function loadChart() {
    // Show modal with list of charts
    const modal = document.getElementById('chart-selector-modal');
    const container = document.getElementById('chart-list-container');
    
    modal.classList.add('active');
    container.innerHTML = '<p>Loading charts...</p>';
    
    try {
        const response = await fetch(`${API_URL}`);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const charts = data.charts || [];
        
        if (charts.length === 0) {
            container.innerHTML = '<p>No charts found. Create one first!</p>';
            return;
        }
        
        // Display chart list
        container.innerHTML = charts.map(chart => `
            <div class="chart-list-item" onclick="selectChart('${chart.chartId}')">
                <h3>${chart.title || chart.chartId}</h3>
                <p>ID: ${chart.chartId} | Type: ${chart.type || 'unknown'}</p>
            </div>
        `).join('');
        
    } catch (e) {
        container.innerHTML = `<p style="color: #e74c3c;">Error loading charts: ${e.message}</p>`;
    }
}

function closeChartSelector() {
    document.getElementById('chart-selector-modal').classList.remove('active');
}

async function selectChart(chartId) {
    closeChartSelector();
    
    // Set the chart ID in the form
    document.getElementById('chart-id').value = chartId;
    
    try {
        const response = await fetch(`${API_URL}/${chartId}`);
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('chart-config').value = JSON.stringify(data.config, null, 2);
            document.getElementById('chart-type').value = data.type || 'line';
            document.getElementById('chart-title').value = data.metadata?.title || '';
            document.getElementById('chart-description').value = data.metadata?.description || '';
            
            generateFormFields(data.config); // Regenerate form fields
            chartInstance.setOption(data.config, true);
            showAlert('Chart loaded successfully!', 'success');
        } else {
            showAlert(`Error: ${data.error || 'Chart not found'}`, 'error');
        }
    } catch (e) {
        showAlert(`Network error: ${e.message}`, 'error');
    }
}

function showAlert(message, type) {
    const container = document.getElementById('alert-container');
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.innerHTML = '';
    container.appendChild(alert);
    
    setTimeout(() => {
        alert.remove();
    }, 5000);
}

// Load chart types from database on page load
async function loadChartTypes() {
    const select = document.getElementById('chart-type');
    
    try {
        const response = await fetch(`${API_URL}/types`);
        
        if (response.ok) {
            const data = await response.json();
            const types = data.types || [];
            
            if (types.length > 0) {
                select.innerHTML = types.map(type => 
                    `<option value="${type.value}">${type.label}</option>`
                ).join('');
                
                // Load the first template automatically
                const firstType = types[0].value;
                await loadTemplate(firstType);
            } else {
                select.innerHTML = '<option value="">No chart types available</option>';
            }
        } else {
            console.error('Failed to load chart types');
            select.innerHTML = '<option value="">Error loading chart types</option>';
        }
    } catch (e) {
        console.error('Error loading chart types:', e);
        select.innerHTML = '<option value="">Error loading chart types</option>';
    }
}

// Load template function (extracted for reuse)
async function loadTemplate(chartType) {
    if (!chartType) return;
    
    try {
        const response = await fetch(`${API_URL}/templates/${chartType}`);
        
        if (response.ok) {
            const data = await response.json();
            document.getElementById('chart-config').value = JSON.stringify(data.config, null, 2);
            generateFormFields(data.config);
            previewChart();
        } else {
            console.log(`No template found for ${chartType}`);
        }
    } catch (e) {
        console.error('Error loading template:', e);
    }
}

// Tab switching
function switchTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    event.target.classList.add('active');
    
    // Update tab content
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById(`${tabName}-tab`).classList.add('active');
}

// Generate form fields from JSON config
function generateFormFields(config) {
    const container = document.getElementById('form-builder-container');
    container.innerHTML = '';
    
    if (!config) {
        container.innerHTML = '<p style="color: #666; font-style: italic;">No configuration loaded</p>';
        return;
    }
    
    // Title section
    if (config.title || true) {
        const titleSection = createFieldSection('Chart Title');
        titleSection.appendChild(createField('text', 'title.text', config.title?.text || '', 'Title Text'));
        titleSection.appendChild(createField('text', 'title.subtext', config.title?.subtext || '', 'Subtitle'));
        titleSection.appendChild(createField('select', 'title.left', config.title?.left || 'center', 'Alignment', ['left', 'center', 'right']));
        container.appendChild(titleSection);
    }
    
    // Tooltip section
    if (config.tooltip || true) {
        const tooltipSection = createFieldSection('Tooltip');
        tooltipSection.appendChild(createField('select', 'tooltip.trigger', config.tooltip?.trigger || 'item', 'Trigger', ['item', 'axis', 'none']));
        container.appendChild(tooltipSection);
    }
    
    // Legend section
    if (config.legend || true) {
        const legendSection = createFieldSection('Legend');
        legendSection.appendChild(createField('select', 'legend.orient', config.legend?.orient || 'horizontal', 'Orient', ['horizontal', 'vertical']));
        legendSection.appendChild(createField('select', 'legend.left', config.legend?.left || 'center', 'Horizontal', ['left', 'center', 'right']));
        legendSection.appendChild(createField('select', 'legend.top', config.legend?.top || 'bottom', 'Vertical', ['top', 'middle', 'bottom']));
        container.appendChild(legendSection);
    }
    
    // Axes section (for line, bar, scatter charts)
    if (config.xAxis || config.yAxis) {
        const axisSection = createFieldSection('Axes');
        
        if (config.xAxis) {
            axisSection.appendChild(createField('text', 'xAxis.name', config.xAxis.name || '', 'X-Axis Label'));
            if (config.xAxis.type === 'category' && Array.isArray(config.xAxis.data)) {
                axisSection.appendChild(createDataArrayEditor('xAxis.data', config.xAxis.data, 'X-Axis Categories', 'text'));
            }
        }
        
        if (config.yAxis) {
            axisSection.appendChild(createField('text', 'yAxis.name', config.yAxis.name || '', 'Y-Axis Label'));
        }
        
        container.appendChild(axisSection);
    }
    
    // Series section (data)
    if (config.series && Array.isArray(config.series)) {
        config.series.forEach((series, index) => {
            const seriesSection = createFieldSection(`Series ${index + 1}: ${series.name || series.type || 'Data'}`);
            
            seriesSection.appendChild(createField('text', `series.${index}.name`, series.name || '', 'Series Name'));
            seriesSection.appendChild(createField('color', `series.${index}.itemStyle.color`, series.itemStyle?.color || '#5470c6', 'Color'));
            
            // Handle different data formats
            if (Array.isArray(series.data)) {
                if (series.type === 'pie') {
                    // Pie chart: [{value, name}, ...]
                    seriesSection.appendChild(createPieDataEditor(`series.${index}.data`, series.data));
                } else if (series.type === 'scatter') {
                    // Scatter: [[x, y], ...]
                    seriesSection.appendChild(createScatterDataEditor(`series.${index}.data`, series.data));
                } else if (series.type === 'candlestick') {
                    // Candlestick: [[open, close, low, high], ...]
                    seriesSection.appendChild(createCandlestickDataEditor(`series.${index}.data`, series.data));
                } else {
                    // Line/Bar: [number, ...]
                    seriesSection.appendChild(createDataArrayEditor(`series.${index}.data`, series.data, 'Data Values', 'number'));
                }
            }
            
            container.appendChild(seriesSection);
        });
    }
}

// Create a field section container (collapsible)
function createFieldSection(title) {
    const section = document.createElement('div');
    section.className = 'collapsible-section collapsed';
    
    const header = document.createElement('div');
    header.className = 'collapsible-header';
    header.onclick = function() {
        section.classList.toggle('collapsed');
    };
    
    const heading = document.createElement('h3');
    heading.textContent = title;
    header.appendChild(heading);
    
    const toggle = document.createElement('span');
    toggle.className = 'collapsible-toggle';
    header.appendChild(toggle);
    
    section.appendChild(header);
    
    // Create content container for fields
    const content = document.createElement('div');
    content.className = 'collapsible-content';
    section.appendChild(content);
    
    // Override appendChild to add fields to content instead of section
    const originalAppendChild = section.appendChild.bind(section);
    section.appendChild = function(child) {
        if (child !== header && child !== content) {
            content.appendChild(child);
        } else {
            originalAppendChild(child);
        }
    };
    
    return section;
}

// Create a form field
function createField(type, path, value, label, options = null) {
    const row = document.createElement('div');
    row.className = 'field-row';
    
    const labelEl = document.createElement('label');
    labelEl.textContent = label;
    row.appendChild(labelEl);
    
    let input;
    if (type === 'select' && options) {
        input = document.createElement('select');
        options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
            if (opt === value) option.selected = true;
            input.appendChild(option);
        });
    } else {
        input = document.createElement('input');
        input.type = type;
        input.value = value;
    }
    
    input.dataset.configPath = path;
    input.addEventListener('change', syncFormToJSON);
    
    row.appendChild(input);
    return row;
}

// Create data array editor (for simple arrays)
function createDataArrayEditor(path, data, label, inputType = 'text') {
    const container = document.createElement('div');
    
    const labelEl = document.createElement('label');
    labelEl.textContent = label;
    labelEl.style.display = 'block';
    labelEl.style.marginBottom = '0.5rem';
    labelEl.style.fontWeight = '600';
    container.appendChild(labelEl);
    
    const editor = document.createElement('div');
    editor.className = 'data-editor';
    editor.dataset.configPath = path;
    editor.dataset.inputType = inputType;
    
    data.forEach((value, index) => {
        editor.appendChild(createDataRow(value, index, inputType));
    });
    
    const addBtn = document.createElement('button');
    addBtn.className = 'add-data-btn';
    addBtn.textContent = '+ Add Value';
    addBtn.onclick = () => {
        const newIndex = editor.querySelectorAll('.data-row').length;
        editor.insertBefore(createDataRow('', newIndex, inputType), addBtn);
        syncFormToJSON();
    };
    editor.appendChild(addBtn);
    
    container.appendChild(editor);
    return container;
}

// Create a single data row
function createDataRow(value, index, inputType) {
    const row = document.createElement('div');
    row.className = 'data-row';
    
    const input = document.createElement('input');
    input.type = inputType;
    input.value = value;
    input.dataset.index = index;
    input.addEventListener('change', syncFormToJSON);
    
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.onclick = () => {
        row.remove();
        syncFormToJSON();
    };
    
    row.appendChild(input);
    row.appendChild(removeBtn);
    return row;
}

// Create candlestick data row
function createCandlestickDataRow(candle, index) {
    const row = document.createElement('div');
    row.className = 'data-row';
    
    const fields = ['Open', 'Close', 'Low', 'High'];
    fields.forEach((field, i) => {
        const input = document.createElement('input');
        input.type = 'number';
        input.placeholder = field;
        input.value = candle[i] || 0;
        input.dataset.index = index;
        input.dataset.field = i.toString();
        input.style.flex = '1';
        input.addEventListener('change', syncFormToJSON);
        row.appendChild(input);
    });
    
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.onclick = () => {
        row.remove();
        syncFormToJSON();
    };
    
    row.appendChild(removeBtn);
    return row;
}

// Sync form values to JSON editor
function syncFormToJSON() {
    try {
        const config = JSON.parse(document.getElementById('chart-config').value || '{}');
        
        // Update simple fields
        document.querySelectorAll('[data-config-path]').forEach(input => {
            if (input.classList.contains('data-editor')) return; // Skip data editors
            
            const path = input.dataset.configPath;
            const value = input.type === 'number' ? parseFloat(input.value) || 0 : input.value;
            setNestedValue(config, path, value);
        });
        
        // Update data arrays
        document.querySelectorAll('.data-editor').forEach(editor => {
            const path = editor.dataset.configPath;
            const dataType = editor.dataset.dataType;
            const inputType = editor.dataset.inputType;
            
            let data = [];
            
            if (dataType === 'pie') {
                // Pie data: [{value, name}, ...]
                editor.querySelectorAll('.data-row').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs.length === 2) {
                        data.push({
                            name: inputs[0].value,
                            value: parseFloat(inputs[1].value) || 0
                        });
                    }
                });
            } else if (dataType === 'scatter') {
                // Scatter: [[x, y], ...]
                editor.querySelectorAll('.data-row').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs.length === 2) {
                        data.push([
                            parseFloat(inputs[0].value) || 0,
                            parseFloat(inputs[1].value) || 0
                        ]);
                    }
                });
            } else if (dataType === 'candlestick') {
                // Candlestick: [[open, close, low, high], ...]
                editor.querySelectorAll('.data-row').forEach(row => {
                    const inputs = row.querySelectorAll('input[type="number"]');
                    if (inputs.length === 4) {
                        data.push([
                            parseFloat(inputs[0].value) || 0,
                            parseFloat(inputs[1].value) || 0,
                            parseFloat(inputs[2].value) || 0,
                            parseFloat(inputs[3].value) || 0
                        ]);
                    }
                });
            } else {
                // Simple array
                editor.querySelectorAll('.data-row input').forEach(input => {
                    const value = inputType === 'number' ? (parseFloat(input.value) || 0) : input.value;
                    data.push(value);
                });
            }
            
            setNestedValue(config, path, data);
        });
        
        document.getElementById('chart-config').value = JSON.stringify(config, null, 2);
        updatePreview(); // Update preview without regenerating form
    } catch (e) {
        console.error('Error syncing form to JSON:', e);
    }
}

// Update preview without regenerating form (to avoid infinite loops)
function updatePreview() {
    try {
        const configText = document.getElementById('chart-config').value;
        const config = JSON.parse(configText);
        chartInstance.setOption(config, true);
    } catch (e) {
        console.error('Error updating preview:', e);
    }
}

// Helper to set nested object value by path string
function setNestedValue(obj, path, value) {
    const parts = path.split('.');
    let current = obj;
    
    for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!current[part]) {
            current[part] = {};
        }
        current = current[part];
    }
    
    current[parts[parts.length - 1]] = value;
}

// Make chart responsive
window.addEventListener('resize', () => {
    if (chartInstance) {
        chartInstance.resize();
    }
});
</script>

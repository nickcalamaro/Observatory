{{ define "header" }}
   {{ partial "site-header.html" . }}
{{ end }}

{{ define "main" }}
<style>
    .admin-container {
        max-width: 1400px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        font-family: inherit;
    }
    .form-group textarea {
        font-family: 'Courier New', monospace;
        min-height: 400px;
        resize: vertical;
    }
    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .btn-primary {
        background-color: #357edd;
        color: white;
    }
    .btn-primary:hover {
        background-color: #2868c7;
    }
    .btn-secondary {
        background-color: #5a6169;
        color: white;
    }
    .btn-secondary:hover {
        background-color: #4a5159;
    }
    .preview-section {
        margin-top: 2rem;
        padding: 2rem;
        background: #f7f7f7;
        border-radius: 8px;
    }
    #chart-preview {
        width: 100%;
        height: 500px;
        background: white;
        border-radius: 4px;
    }
    .alert {
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 4px;
    }
    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .hidden {
        display: none;
    }
    .examples {
        margin-top: 1rem;
    }
    .example-btn {
        padding: 0.5rem 1rem;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        background: #e9ecef;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .example-btn:hover {
        background: #dee2e6;
    }
</style>

<div class="admin-container">
    <div class="admin-header">
        <h1>Chart Data Admin</h1>
    </div>
    
    <div id="alert-container"></div>
    
    <div class="form-grid">
        <div>
            <div class="form-group">
                <label for="api-url">API URL</label>
                <input type="text" id="api-url" placeholder="https://api.yourdomain.com/api/charts" value="https://api.yourdomain.com/api/charts">
            </div>
            
            <div class="form-group">
                <label for="api-key">API Key (for saving)</label>
                <input type="password" id="api-key" placeholder="your-secret-api-key">
            </div>
            
            <div class="form-group">
                <label for="chart-id">Chart ID</label>
                <input type="text" id="chart-id" placeholder="newsletter-gradient-area" value="newsletter-gradient-area">
            </div>
            
            <div class="form-group">
                <label for="chart-type">Chart Type</label>
                <select id="chart-type">
                    <option value="line">Line</option>
                    <option value="bar">Bar</option>
                    <option value="pie">Pie</option>
                    <option value="scatter">Scatter</option>
                    <option value="radar">Radar</option>
                    <option value="candlestick">Candlestick</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="chart-title">Chart Title</label>
                <input type="text" id="chart-title" placeholder="My Chart" value="Gradient Stacked Area Chart">
            </div>
            
            <div class="form-group">
                <label for="chart-description">Description</label>
                <input type="text" id="chart-description" placeholder="Chart description">
            </div>
            
            <div class="examples">
                <strong>Load Example:</strong><br>
                <button class="example-btn" onclick="loadExample('gradient-area')">Gradient Area</button>
                <button class="example-btn" onclick="loadExample('bar')">Bar Chart</button>
                <button class="example-btn" onclick="loadExample('pie')">Pie Chart</button>
            </div>
        </div>
        
        <div>
            <div class="form-group">
                <label for="chart-config">ECharts Configuration (JSON)</label>
                <textarea id="chart-config" placeholder='{"title": {"text": "My Chart"}, "series": [...]}'>
                </textarea>
            </div>
        </div>
    </div>
    
    <div style="margin-bottom: 2rem;">
        <button class="btn btn-primary" onclick="saveChart()">💾 Save to API</button>
        <button class="btn btn-secondary" onclick="loadChart()">📥 Load from API</button>
        <button class="btn btn-secondary" onclick="previewChart()">👁️ Preview</button>
        <button class="btn btn-secondary" onclick="validateJSON()">✓ Validate JSON</button>
    </div>
    
    <div class="preview-section">
        <h2>Preview</h2>
        <div id="chart-preview"></div>
    </div>
</div>

{{ end }}

{{ define "footer" }}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
let previewChart = null;

// Initialize preview chart
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('chart-preview');
    previewChart = echarts.init(container);
    
    // Load default example
    loadExample('gradient-area');
});

// Example configurations
const examples = {
    'gradient-area': {
        color: ['#80FFA5', '#00DDFF', '#37A2FF', '#FF0087', '#FFBF00'],
        title: {
            text: 'Gradient Stacked Area Chart',
            left: 'center',
            top: 10
        },
        tooltip: {
            trigger: 'axis',
            axisPointer: {
                type: 'cross',
                label: { backgroundColor: '#6a7985' }
            }
        },
        legend: {
            data: ['Line 1', 'Line 2', 'Line 3', 'Line 4', 'Line 5'],
            top: 45
        },
        grid: { top: 100 },
        toolbox: {
            feature: { saveAsImage: {} }
        },
        xAxis: [{
            type: 'category',
            boundaryGap: false,
            data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
        }],
        yAxis: [{ type: 'value' }],
        series: [
            {
                name: 'Line 1',
                type: 'line',
                stack: 'Total',
                smooth: true,
                lineStyle: { width: 0 },
                showSymbol: false,
                areaStyle: {
                    opacity: 0.8,
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgb(128, 255, 165)' },
                        { offset: 1, color: 'rgb(1, 191, 236)' }
                    ])
                },
                emphasis: { focus: 'series' },
                data: [140, 232, 101, 264, 90, 340, 250]
            },
            {
                name: 'Line 2',
                type: 'line',
                stack: 'Total',
                smooth: true,
                lineStyle: { width: 0 },
                showSymbol: false,
                areaStyle: {
                    opacity: 0.8,
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgb(0, 221, 255)' },
                        { offset: 1, color: 'rgb(77, 119, 255)' }
                    ])
                },
                emphasis: { focus: 'series' },
                data: [120, 282, 111, 234, 220, 340, 310]
            }
        ]
    },
    'bar': {
        title: { text: 'Bar Chart Example' },
        tooltip: {},
        xAxis: {
            type: 'category',
            data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
        },
        yAxis: { type: 'value' },
        series: [{
            name: 'Sales',
            type: 'bar',
            data: [120, 200, 150, 80, 70, 110, 130],
            itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#83bff6' },
                    { offset: 1, color: '#188df0' }
                ])
            }
        }]
    },
    'pie': {
        title: { text: 'Pie Chart Example', left: 'center' },
        tooltip: { trigger: 'item' },
        legend: { orient: 'vertical', left: 'left' },
        series: [{
            name: 'Access From',
            type: 'pie',
            radius: '50%',
            data: [
                { value: 1048, name: 'Search Engine' },
                { value: 735, name: 'Direct' },
                { value: 580, name: 'Email' },
                { value: 484, name: 'Union Ads' },
                { value: 300, name: 'Video Ads' }
            ],
            emphasis: {
                itemStyle: {
                    shadowBlur: 10,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                }
            }
        }]
    }
};

function loadExample(exampleName) {
    const config = examples[exampleName];
    if (!config) return;
    
    document.getElementById('chart-config').value = JSON.stringify(config, null, 2);
    previewChart.setOption(config, true);
    
    if (config.title && config.title.text) {
        document.getElementById('chart-title').value = config.title.text;
    }
}

function validateJSON() {
    const configText = document.getElementById('chart-config').value;
    try {
        JSON.parse(configText);
        showAlert('JSON is valid!', 'success');
        return true;
    } catch (e) {
        showAlert(`Invalid JSON: ${e.message}`, 'error');
        return false;
    }
}

function previewChart() {
    if (!validateJSON()) return;
    
    const configText = document.getElementById('chart-config').value;
    const config = JSON.parse(configText);
    
    try {
        previewChart.setOption(config, true);
        showAlert('Preview updated!', 'success');
    } catch (e) {
        showAlert(`Error rendering chart: ${e.message}`, 'error');
    }
}

async function saveChart() {
    if (!validateJSON()) return;
    
    const apiUrl = document.getElementById('api-url').value;
    const apiKey = document.getElementById('api-key').value;
    const chartId = document.getElementById('chart-id').value;
    const chartType = document.getElementById('chart-type').value;
    const title = document.getElementById('chart-title').value;
    const description = document.getElementById('chart-description').value;
    const configText = document.getElementById('chart-config').value;
    
    if (!apiKey) {
        showAlert('Please enter your API key', 'error');
        return;
    }
    
    if (!chartId) {
        showAlert('Please enter a chart ID', 'error');
        return;
    }
    
    const payload = {
        type: chartType,
        metadata: {
            title: title,
            description: description
        },
        config: JSON.parse(configText)
    };
    
    try {
        const response = await fetch(`${apiUrl}/${chartId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-API-Key': apiKey
            },
            body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert(`Chart saved successfully! ID: ${result.chartId}`, 'success');
        } else {
            showAlert(`Error: ${result.error || 'Failed to save chart'}`, 'error');
        }
    } catch (e) {
        showAlert(`Network error: ${e.message}`, 'error');
    }
}

async function loadChart() {
    const apiUrl = document.getElementById('api-url').value;
    const chartId = document.getElementById('chart-id').value;
    
    if (!chartId) {
        showAlert('Please enter a chart ID', 'error');
        return;
    }
    
    try {
        const response = await fetch(`${apiUrl}/${chartId}`);
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('chart-config').value = JSON.stringify(data.config, null, 2);
            document.getElementById('chart-type').value = data.type || 'line';
            document.getElementById('chart-title').value = data.metadata?.title || '';
            document.getElementById('chart-description').value = data.metadata?.description || '';
            
            previewChart.setOption(data.config, true);
            showAlert('Chart loaded successfully!', 'success');
        } else {
            showAlert(`Error: ${data.error || 'Chart not found'}`, 'error');
        }
    } catch (e) {
        showAlert(`Network error: ${e.message}`, 'error');
    }
}

function showAlert(message, type) {
    const container = document.getElementById('alert-container');
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.innerHTML = '';
    container.appendChild(alert);
    
    setTimeout(() => {
        alert.remove();
    }, 5000);
}

// Make chart responsive
window.addEventListener('resize', () => {
    if (previewChart) {
        previewChart.resize();
    }
});
</script>

{{ end }}
